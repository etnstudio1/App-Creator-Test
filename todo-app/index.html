<!DOCTYPE html>
<html>
<head>
    <title>My To-Do</title>
        <style>
                body { font-family: Arial; background: #0d1117; color: white; text-align: center; padding: 40px; }
                        input, button { padding: 10px; margin: 5px; border-radius: 8px; border: none; }
                                button { background: #58a6ff; color: black; cursor: pointer; }
                                        ul { list-style: none; padding: 0; }
                                                li { background: #161b22; padding: 10px; margin: 5px auto; width: 300px; border-radius: 8px; border: 1px solid #30363d; }
                                                    </style>
                                                    </head>
                                                    <body>
                                                        <h1>📝 My To-Do List</h1>
                                                            <input type="text" id="taskInput" placeholder="Enter task...">
                                                                <button onclick="addTask()">Add</button>
                                                                    <ul id="taskList"></ul>

                                                                        <script>
                                                                                function addTask() {
                                                                                            let input = document.getElementById('taskInput');
                                                                                                        let li = document.createElement('li');
                                                                                                                    li.textContent = input.value + ' ❌';
                                                                                                                                li.style.cursor = 'pointer';
                                                                                                                                            li.onclick = function() { this.remove(); };
                                                                                                                                                        document.getElementById('taskList').appendChild(li);
                                                                                                                                                                    input.value = '';
                                                                                                                                                                            }
                                                                                                                                                                                </script>
                                                                                                                                                                                </body>
                                                                                                                                                                                </html>
