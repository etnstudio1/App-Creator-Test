<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mera Pehla Web IDE Test</title>
                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                background: linear-gradient(135deg, #0d1117, #161b22);
                                                            color: #c9d1d9;
                                                                        display: flex;
                                                                                    justify-content: center;
                                                                                                align-items: center;
                                                                                                            height: 100vh;
                                                                                                                        margin: 0;
                                                                                                                                    flex-direction: column;
                                                                                                                                            }
                                                                                                                                                    .card {
                                                                                                                                                                background: #1c2333;
                                                                                                                                                                            padding: 40px;
                                                                                                                                                                                        border-radius: 16px;
                                                                                                                                                                                                    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
                                                                                                                                                                                                                border: 1px solid #30363d;
                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                            h1 {
                                                                                                                                                                                                                                                        color: #58a6ff;
                                                                                                                                                                                                                                                                    font-size: 2.5rem;
                                                                                                                                                                                                                                                                                margin-bottom: 10px;
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                p {
                                                                                                                                                                                                                                                                                                            color: #8b949e;
                                                                                                                                                                                                                                                                                                                        font-size: 1.2rem;
                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                                                                                                                    background: #238636;
                                                                                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                                                                                            border: none;
                                                                                                                                                                                                                                                                                                                                                                                        padding: 12px 30px;
                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 1.1rem;
                                                                                                                                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    transition: 0.2s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    button:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #2ea043;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            transform: scale(1.05);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .badge {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 0.9rem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                color: #d29922;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>🚀 GitHub IDE Test</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>Yeh file <strong>direct tool</strong> se push hui hai!</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="alert('🎉 Button kaam kar raha hai!')">Click Me!</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="badge">✅ Successfully deployed via Web IDE</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
