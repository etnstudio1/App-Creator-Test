name: Build APK

on:
  workflow_dispatch:  # Ye "Build APK" button ko activate karega

  jobs:
    build:
        runs-on: ubuntu-latest
            steps:
                  - name: Checkout code
                          uses: actions/checkout@v3

                                - name: Set up Java
                                        uses: actions/setup-java@v3
                                                with:
                                                          java-version: '11'

                                                                - name: Create dummy Android project (test ke liye)
                                                                        run: |
                                                                                  mkdir -p app/src/main
                                                                                            echo "APK Build Test Successful!" > app/test.txt
                                                                                                      zip -r app-debug.apk app/
                                                                                                                
                                                                                                                      - name: Upload APK
                                                                                                                              uses: actions/upload-artifact@v3
                                                                                                                                      with:
                                                                                                                                                name: my-test-apk
                                                                                                                                                          path: app-debug.apk